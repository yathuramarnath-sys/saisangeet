name: Captain App — E2E Tests

on:
  # Tests run against the live production backend — they create and settle real orders.
  # Do NOT enable pull_request auto-trigger: each run pollutes the outlet's table state.
  # Always trigger manually via workflow_dispatch and verify the outlet is clear first.
  workflow_dispatch:
    inputs:
      captain_url:
        description: "Captain app URL to test against"
        required: false
        default: "https://captain.dinexpos.in"

jobs:
  e2e:
    name: Playwright E2E (captain app)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node ─────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── Install deps ──────────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: apps/waiter-mobile
        run: npm install

      # ── Install Playwright browsers ───────────────────────────────────────
      - name: Install Playwright (Chromium only)
        working-directory: apps/waiter-mobile
        run: npx playwright install chromium --with-deps

      # ── Run E2E tests ─────────────────────────────────────────────────────
      - name: Run Playwright tests
        working-directory: apps/waiter-mobile
        env:
          # PR events: test against this branch's Vercel preview so branch fixes are exercised.
          # Update the preview URL below when creating a new branch.
          # workflow_dispatch: override via captain_url input (defaults to preview URL below).
          CAPTAIN_URL:          ${{ github.event.inputs.captain_url || 'https://saisangeet-waiter-mobile-git-claude-recover-l-9587ad-saisangeet.vercel.app' }}
          CAPTAIN_BRANCH_CODE:  ${{ secrets.CAPTAIN_BRANCH_CODE }}
          CAPTAIN_STAFF_NAME:   ${{ secrets.CAPTAIN_STAFF_NAME }}
          CAPTAIN_STAFF_PIN:    ${{ secrets.CAPTAIN_STAFF_PIN }}
          CAPTAIN_SETTLER_NAME: ${{ secrets.CAPTAIN_SETTLER_NAME }}
          CAPTAIN_SETTLER_PIN:  ${{ secrets.CAPTAIN_SETTLER_PIN }}
        run: npm run test:e2e

      # ── Upload report on failure ──────────────────────────────────────────
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            apps/waiter-mobile/playwright-report/
            apps/waiter-mobile/test-results/
          retention-days: 7
